<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISECR Admin</title>


<style>

*{
    box-sizing:border-box;
}


body{

    background:
    radial-gradient(
        circle at top,
        #003322,
        #050505 45%
    );

    color:#00ff88;

    font-family:
    -apple-system,
    "Segoe UI",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

    text-align:center;

    margin:0;

    padding:20px;

    min-height:100vh;

}



/* 標題 */

h1{

    font-size:26px;

    letter-spacing:3px;

    margin-top:15px;

    color:#00ff99;

    text-shadow:

    0 0 8px #00ff88,

    0 0 20px #00ff8844;

}



h2{

    font-size:20px;

    margin-bottom:20px;

}



/* 卡片 */

.box{


    width:92%;

    max-width:460px;

    margin:20px auto;

    padding:22px;


    background:

    linear-gradient(
        145deg,
        #111,
        #080808
    );


    border:

    1px solid #00ff88;


    border-radius:16px;


    box-shadow:

    0 0 20px #00ff8833,

    inset 0 0 15px #00ff8811;


}



/* 輸入框 */

input{


    width:90%;

    max-width:330px;


    padding:14px;


    margin:10px;


    background:#050505;


    color:#00ff88;


    border:

    1px solid #008855;


    border-radius:10px;


    font-size:16px;


    outline:none;


}



input:focus{


    border-color:#00ffaa;


    box-shadow:

    0 0 10px #00ff8877;


}



/* 按鈕 */

button{


    width:130px;


    padding:12px;


    margin:8px;


    background:

    linear-gradient(
        145deg,
        #111,
        #003322
    );


    color:#00ff88;


    border:

    1px solid #00ff88;


    border-radius:10px;


    font-size:16px;


    cursor:pointer;


    transition:.2s;


}



button:hover{


    background:#00ff88;


    color:#111;


    box-shadow:

    0 0 15px #00ff88;


}



/* 控制台 */

#panel{


    display:none;


}



/* 狀態 */

.status{


    border:

    1px solid #006644;


    background:#090909;


    padding:16px;


    border-radius:12px;


    margin-top:15px;


    text-align:left;


    box-shadow:

    inset 0 0 10px #00ff8811;


}



/* 文章 */

.status b{


    color:#00ffaa;


    font-size:17px;


}



.status p{


    color:#ddd;


    line-height:1.6;


}



/* 分隔線 */

hr{


    border:none;


    height:1px;


    background:#00ff8833;


    margin:25px 0;


}



/* 手機適配 */

@media(max-width:500px){


    body{

        padding:10px;

    }


    h1{

        font-size:20px;

    }



    .box{


        width:100%;


        padding:16px;


    }



    input{


        width:100%;


        margin:8px 0;


    }



    button{


        width:100%;


        margin:8px 0;


    }


}


</style>


</head>


<body>



<h1>
🛡 ISECR ADMIN CENTER
</h1>



<div class="box">


<h2>
管理員登入
</h2>



<input

id="name"

placeholder="管理員帳號"

>



<br>



<input

id="pass"

type="password"

placeholder="管理員密碼"

>



<br>



<button onclick="loginAdmin()">

登入

</button>



</div>





<div class="box" id="panel">


<h2>
控制台
</h2>


<div class="status">

管理員已登入

<br><br>

ISECR SYSTEM ONLINE

</div>


<hr>


<h3>
文章管理
</h3>


<div id="postList">

正在載入文章...

</div>


</div>






<script>
    
let adminUsername = "";

    async function loadAdminPosts(){


let res = await fetch(
API+"/posts"
);


let posts = await res.json();



let box =
document.getElementById("postList");



if(posts.length===0){

box.innerHTML="沒有文章";

return;

}



box.innerHTML = posts.map(post=>`


<div class="status">


<b>
作者：
${post.author}
</b>


<p>
${post.content}
</p>


時間：
${post.time}


<br>


<button onclick="adminDelete(${post.id})">

刪除

</button>


</div>


`).join("");



}





async function adminDelete(id){


if(!confirm("確定刪除這篇文章？")){

return;

}



let res =
await fetch(

API+"/posts/"+id,

{

method:"DELETE",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

username:"admin"

})


}

);



let data =
await res.json();



if(data.success){


alert("刪除成功");

loadAdminPosts();


}

else{


alert(
"刪除失敗："+data.message
);


}



}


const API =

"https://isecr-network.onrender.com/api";





async function loginAdmin(){


let username =

document

.getElementById("name")

.value

.trim();



let password =

document

.getElementById("pass")

.value;




if(!username || !password){

alert("請輸入完整資料");

return;

}





let res =

await fetch(

API+"/login",

{


method:"POST",


headers:{

"Content-Type":

"application/json"

},


body:JSON.stringify({

username,

password

})


}

);





let data =

await res.json();



if(

data.success &&

data.user.level==="ADMIN"

){
    adminUsername = username;



document

.getElementById("panel")

.style.display="block";



alert("管理員登入成功");



loadAdminPosts();



}

else{


alert("權限不足");


}



}



</script>



</body>

</html>
