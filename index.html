<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISECR Network v0.5</title>


<style>

*{
    box-sizing:border-box;
}


body{

    background:#111;
    color:#00ff88;

    font-family:
    -apple-system,
    "Segoe UI",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

    text-align:center;

    margin:0;

    padding-bottom:90px;

}



h1{

    font-size:22px;

    letter-spacing:2px;

    padding-top:20px;

    text-shadow:
    0 0 8px #00ff8877;

}



.box{

    width:92%;

    max-width:500px;

    margin:20px auto;

    padding:20px;

    border:

    1px solid #00ff88;


    border-radius:12px;


    background:#0d0d0d;

}



input,
textarea{


    width:90%;

    padding:12px;

    margin:8px;


    background:#1a1a1a;


    color:#00ff88;


    border:

    1px solid #00ff88;


    border-radius:8px;

    font-size:14px;

}



textarea{

    resize:vertical;

}



button{


    padding:10px 18px;

    margin:6px;


    background:#111;


    color:#00ff88;


    border:

    1px solid #00ff88;


    border-radius:8px;


}



button:hover{

    background:#003322;

}



.hidden{

    display:none;

}

    #confirmBox{

    position:fixed;

    top:40%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:999;

    background:#111;

    border:1px solid #00ff88;

    border-radius:12px;

    padding:20px;

    box-shadow:0 0 20px #00ff8877;

    }



/* 動態 */

.post{


    border:

    1px solid #00ff88;


    border-radius:12px;


    padding:15px;


    margin:12px 0;


    text-align:left;


}



.avatar{


    width:40px;

    height:40px;


    border-radius:50%;


    border:

    1px solid #00ff88;


    display:inline-flex;


    align-items:center;


    justify-content:center;


}



.username{

    font-weight:bold;

}



.meta{

    opacity:.6;

    font-size:12px;

    margin-top:6px;

}



.action{

    margin-top:10px;

}



.liked{

    background:#003322;

}



.empty{

    opacity:.5;

    padding:20px;

}



/* 導航 */


.bottom-nav{


    position:fixed;


    bottom:0;


    left:0;


    width:100%;


    height:65px;


    background:#111;


    border-top:

    1px solid #00ff88;


    display:flex;


}



.nav-btn{


    flex:1;


    background:none;


    border:none;


    color:#00ff88;


    opacity:.6;


}



.nav-btn.active{

    opacity:1;

}



</style>

</head>



<body>


<h1 id="titleText">
ISECR INTERNAL NETWORK
</h1>



<!-- 登入入口 -->

<div class="box" id="menu">

<h2 id="authText">
身份驗證
</h2>


<button id="hasAccountText" onclick="showLogin()">
已有帳號
</button>


<button id="registerMenuText" onclick="showRegister()">
註冊

</button>


</div>



<!-- 登入 -->

<div class="box hidden" id="login">


<h2 id="loginTitle">
成員登入
</h2>


<input id="loginName"
placeholder="用戶名">


<input id="loginPass"
type="password"
placeholder="密碼">


<br>


<button id="loginButtonText" onclick="login()">
登入
</button>


<button id="loginBackText" onclick="backMenu()">
返回
</button>


</div>



<!-- 註冊 -->

<div class="box hidden" id="register">


<h2 id="registerTitle">
新成員註冊
</h2>


<input id="invite"
placeholder="邀請碼">


<input id="regName"
placeholder="自定義用戶名">


<input id="regPass"
type="password"
placeholder="自定義密碼">


<br>


<button id="createAccountText" onclick="register()">
建立帳號
</button>


<button id="backText" onclick="backMenu()">
返回
</button>


</div>



<!-- 主頁 -->


<div class="box hidden" id="home">


<h2 id="homeTitle">
🏠 ISECR 動態牆
</h2>


<div id="profileMini"></div>


<hr>


<textarea
id="postInput"
rows="4">
</textarea>


<br>


<button id="postButtonText" onclick="createPost()">
發布
</button>



<hr>


<div id="feed"></div>


</div>



<!-- 個人 -->

<div class="box hidden" id="profile">

<div id="profileCard"></div>


</div>



<!-- 成員 -->

<div class="box hidden" id="members">


<h2 id="membersTitle">
👥 成員
</h2>


<div id="memberList"></div>


</div>



<!-- 設定 -->


<div class="box hidden" id="settings">


<h2 id="settingsTitle">
⚙ 設定
</h2>


<button onclick="changeLanguage('zh')">
繁體中文
</button>


<button onclick="changeLanguage('es')">
Español
</button>


<br>


<button id="logoutText" onclick="logout()">
登出
</button>


</div>



</div>


<div id="confirmBox" class="hidden">

<p>確定刪除?</p>

<button onclick="confirmDelete(true)">
Y
</button>

<button onclick="confirmDelete(false)">
N
</button>

</div>



<div class="bottom-nav hidden" id="navbar">


<button class="nav-btn"
onclick="showPage('home')">

🏠

</button>


<button class="nav-btn"
onclick="showPage('members')">

👥

</button>


<button class="nav-btn"
onclick="showPage('profile')">

👤

</button>


<button class="nav-btn"
onclick="showPage('settings')">

⚙

</button>


</div>

<script>

const API = "https://isecr-network.onrender.com/api";


// ======================
// 語言系統
// ======================

const lang = {

zh:{

title:"ISECR INTERNAL NETWORK",

auth:"身份驗證",

login:"登入",

register:"註冊",

username:"用戶名",

password:"密碼",

invite:"邀請碼",

home:"動態牆",

members:"成員",

profile:"個人資料",

settings:"設定",

post:"發布",

reply:"回覆",

delete:"刪除",

level:"等級",

empty:"目前沒有文章",

success:"操作成功",

hasAccount:"已有帳號",

loginTitle:"成員登入",

back:"返回",

homeTitle:"🏠 動態牆",

registerTitle:"新成員註冊",

settingsTitle:"⚙ 設定",

createAccount:"建立帳號",

logout:"登出",

membersTitle:"👥 成員",

postPlaceholder:"發布新的訊息...",

commentList:"回覆列表",

inputReply:"輸入新回覆",

confirmDelete:"確定刪除?",

emptyContent:"內容不能為空",

authReject:"身份驗證拒絕",

registerSuccess:"註冊成功\n帳號：",

error:"操作失敗"

},


es:{

title:"RED INTERNA ISECR",

auth:"Autenticación",

login:"Iniciar sesión",

register:"Registrarse",

username:"Nombre de usuario",

password:"Contraseña",

invite:"Código de invitación",

home:"Muro",

members:"Miembros",

profile:"Perfil",

settings:"Configuración",

post:"Publicar",

reply:"Responder",

delete:"Eliminar",

logout:"Cerrar sesión",

level:"Nivel",

empty:"No hay publicaciones",

success:"Operación exitosa",

hasAccount:"Ya tengo cuenta",

loginTitle:"Inicio de sesión",

back:"Volver",

homeTitle:"🏠 Muro",

registerTitle:"Registro de nuevo miembro",

settingsTitle:"⚙ Configuración",

createAccount:"Crear cuenta",

membersTitle:"👥 Miembros",

postPlaceholder:"Publicar un nuevo mensaje...",

commentList:"Lista de respuestas",

inputReply:"Escribe una respuesta",

confirmDelete:"¿Confirmar eliminación?",

emptyContent:"El contenido no puede estar vacío",

authReject:"Autenticación rechazada",

registerSuccess:"Registro exitoso\nCuenta:",

error:"Operación fallida"

}

};


let currentLang =
localStorage.getItem("language") || "zh";


let currentUser = null;

    function changeLanguage(language){

    currentLang = language;

localStorage.setItem("language", language);


    document.getElementById("titleText").innerText =
    lang[currentLang].title;


    document.getElementById("authText").innerText =
    lang[currentLang].auth;


    document.getElementById("hasAccountText").innerText =
    lang[currentLang].hasAccount;


    document.getElementById("loginButtonText").innerText =
    lang[currentLang].login;


    document.getElementById("registerMenuText").innerText =
    lang[currentLang].register;


    document.getElementById("loginName").placeholder =
    lang[currentLang].username;


    document.getElementById("loginPass").placeholder =
    lang[currentLang].password;


document.getElementById("loginTitle").innerText =
lang[currentLang].loginTitle;


document.getElementById("backText").innerText =
lang[currentLang].back;


document.getElementById("loginBackText").innerText =
lang[currentLang].back;


document.getElementById("registerTitle").innerText =
lang[currentLang].registerTitle;


document.getElementById("settingsTitle").innerText =
lang[currentLang].settingsTitle;


document.getElementById("invite").placeholder =
lang[currentLang].invite;


document.getElementById("regName").placeholder =
lang[currentLang].username;


document.getElementById("regPass").placeholder =
lang[currentLang].password;


document.getElementById("createAccountText").innerText =
lang[currentLang].createAccount;


document.getElementById("logoutText").innerText =
lang[currentLang].logout;


document.getElementById("postButtonText").innerText =
lang[currentLang].post;


document.getElementById("homeTitle").innerText =
lang[currentLang].homeTitle;


document.getElementById("membersTitle").innerText =
lang[currentLang].membersTitle;


document.getElementById("postInput").placeholder =
lang[currentLang].postPlaceholder;

}



// ======================
// 初始化
// ======================


window.onload = async ()=>{

    changeLanguage(currentLang);

    const saved =
    localStorage.getItem("currentUser");


    if(saved){

        currentUser =
        JSON.parse(saved);

        enterApp();

    }

};



// ======================
// 頁面控制
// ======================


const pages=[

"menu",
"login",
"register",
"home",
"profile",
"members",
"settings"

];



function hideAll(){

    pages.forEach(id=>{

        const e=
        document.getElementById(id);

        if(e)
        e.classList.add("hidden");

    });

}



function showPage(page){


    hideAll();


    document
    .getElementById(page)
    .classList.remove("hidden");



    if(page==="home")
    loadPosts();



    if(page==="members")
    loadMembers();



    if(page==="profile")
    showProfile();


}



function backMenu(){

    hideAll();

    document
    .getElementById("menu")
    .classList.remove("hidden");

}




// ======================
// 登入
// ======================


function showLogin(){

    hideAll();

    document
    .getElementById("login")
    .classList
    .remove("hidden");

}



function showRegister(){

    hideAll();

    document
    .getElementById("register")
    .classList
    .remove("hidden");

}





async function login(){


    let username =
    document
    .getElementById("loginName")
    .value.trim();


    let password =
    document
    .getElementById("loginPass")
    .value;



    let res =
    await fetch(
        API+"/login",
        {

            method:"POST",

            headers:{

                "Content-Type":
                "application/json"

            },


            body:JSON.stringify({

                username,
                password

            })

        }
    );



    let data =
    await res.json();



    if(data.success){


        currentUser =
        data.user;


        localStorage
        .setItem(
            "currentUser",
            JSON.stringify(currentUser)
        );


        enterApp();


    }

    else{


        alert(
lang[currentLang].authReject
);


    }


}






// ======================
// 邀請碼註冊
// ======================


async function register(){

    let invite =
    document
    .getElementById("invite")
    .value.trim();


    let username =
    document
    .getElementById("regName")
    .value.trim();


    let password =
    document
    .getElementById("regPass")
    .value;



    let res;

try{

    res =
    await fetch(
        API+"/register",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                invite,
                username,
                password
            })

        }
    );

}

catch(e){

    alert("伺服器連接失敗");

    return;

}


let data =
    await res.json();



    if(data.success){

        alert(
lang[currentLang].registerSuccess
+username
);


        showLogin();


        document
        .getElementById("loginName")
        .value = username;


    }
    else{

        alert(data.message);

    }

}


// ======================
// 進入系統
// ======================


function enterApp(){


    document
    .getElementById("navbar")
    .classList
    .remove("hidden");


    showPage("home");


}





function logout(){


    currentUser=null;


    localStorage
    .removeItem(
        "currentUser"
    );


    document
    .getElementById("navbar")
    .classList
    .add("hidden");


    backMenu();


}




// ======================
// 成員列表
// ======================


async function loadMembers(){


    let res =
    await fetch(
    API+"/members"
    );


    let members =
    await res.json();



    document
    .getElementById("memberList")
    .innerHTML =

    members.map(m=>`

    <div class="post">

    <b>
    ${m.username}
    </b>

    <br>

    ${lang[currentLang].level}：
${m.level}

    <br>

    ${m.bio}

    </div>


    `).join("");



}





// ======================
// 個人資料
// ======================


function showProfile(){


    if(!currentUser)
    return;



    document
    .getElementById("profileCard")
    .innerHTML=

    `

    <div class="post">

    <h2>
    ${currentUser.username}
    </h2>


    <p>
${lang[currentLang].level}：
${currentUser.level}
</p>


    <p>
    ${currentUser.bio}
    </p>


    </div>

    `;



}



// ======================
// 動態牆系統
// ======================


// 取得文章

async function loadPosts(){


    let res =
    await fetch(
        API+"/posts"
    );


    let posts =
    await res.json();



    const box =
    document.getElementById("feed");



    if(posts.length===0){


        box.innerHTML =
        `

        <div class="empty">

${lang[currentLang].empty}

</div>

        `;


        return;

    }



    box.innerHTML =

    posts
    .map(post=>{


        let liked =
        post.likedBy.includes(
            currentUser.username
        );



        return `


        <div class="post">


        <b>
        ${post.author}
        </b>


        <p>
        ${post.content}
        </p>


        <div class="meta">

        ${post.time}

        </div>



        <div class="action">


        <button
        onclick="likePost(${post.id})"
        class="${liked?'liked':''}">

        ❤️ ${post.likes}

        </button>

        <button onclick="showComments(${post.id})">
💬 ${lang[currentLang].reply}
</button>



        ${
        post.author===currentUser.username

        ?

        `

        <button
onclick="deletePost(${post.id})">

${lang[currentLang].delete}

</button>

        `

        :""

        }



        </div>


        </div>


        `;


    })
    .join("");

}




// 發文


async function createPost(){


    let input =
    document
    .getElementById("postInput");



    let text =
    input.value.trim();



    if(text===""){

        alert(
lang[currentLang].emptyContent
);

        return;

    }




    await fetch(
        API+"/posts",
        {

        method:"POST",

        headers:{

        "Content-Type":
        "application/json"

        },


        body:
        JSON.stringify({

        author:
        currentUser.username,


        content:
        text


        })


        }

    );



    input.value="";


    loadPosts();


}






// 點讚


async function likePost(id){



    await fetch(

        API+"/posts/"+id+"/like",

        {

        method:"POST",


        headers:{

        "Content-Type":
        "application/json"

        },


        body:
        JSON.stringify({

        user:
        currentUser.username

        })


        }

    );



    loadPosts();



}





// 刪除文章


let deleteId = null;


function deletePost(id){

    deleteId = id;

    document
    .getElementById("confirmBox")
    .classList
    .remove("hidden");

}



async function confirmDelete(result){

    document
    .getElementById("confirmBox")
    .classList
    .add("hidden");


    if(!result)
    return;


    await fetch(

        API+"/posts/"+deleteId,

        {
            method:"DELETE",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:
                currentUser.username

            })

        }

    );


    loadPosts();

}



async function showComments(id){

    let res =
    await fetch(
        API+"/posts/"+id+"/comments"
    );


    let comments =
    await res.json();


    let text = "";


    comments.forEach(c=>{

        text +=
        c.author+
        ": "+
        c.content+
        "\n";

    });


    let reply =
prompt(
    lang[currentLang].commentList+
    "\n\n"+
    text+
    "\n"+
    lang[currentLang].inputReply
);


    if(reply){

        await fetch(
            API+"/posts/"+id+"/comments",
            {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                author:
                currentUser.username,

                content:
                reply

            })

            }
        );


    }

}



</script>

</body>
</html>
