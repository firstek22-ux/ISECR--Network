<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISECR Network v0.4</title>

<style>
* { box-sizing: border-box; }

body {
  background: #111;
  color: #00ff88;
  font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  text-align: center;
  padding-bottom: 90px;
  margin: 0;
}

h1 {
  font-size: 22px;
  letter-spacing: 2px;
  padding-top: 20px;
  text-shadow: 0 0 8px #00ff8877;
}

.box {
  width: 92%;
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  border: 1px solid #00ff88;
  border-radius: 12px;
  box-sizing: border-box;
  background: #0d0d0d;
}

input, textarea {
  width: 90%;
  padding: 12px;
  margin: 8px;
  background: #1a1a1a;
  color: #00ff88;
  border: 1px solid #00ff88;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
}

textarea { resize: vertical; }

button {
  padding: 10px 18px;
  margin: 6px;
  background: #111;
  color: #00ff88;
  border: 1px solid #00ff88;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s ease;
}

button:active,
button:hover { background: #003322; }

button:disabled {
  opacity: .4;
  cursor: default;
}

.hidden { display: none; }

/* 動態卡片 */
.post {
  border: 1px solid #00ff88;
  border-radius: 12px;
  padding: 15px;
  margin: 12px 0;
  text-align: left;
}

.post-body { cursor: pointer; }

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #00ff88;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 8px;
  flex-shrink: 0;
}

.username { font-weight: bold; }

.meta {
  opacity: .6;
  font-size: 12px;
  margin-top: 6px;
}

.action {
  margin-top: 10px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.action button.liked { background: #00ff8833; }

.comment {
  border-left: 2px solid #00ff88;
  padding-left: 10px;
  margin-top: 8px;
  text-align: left;
}

.comment b { display: block; margin-bottom: 2px; }

.empty {
  opacity: .5;
  padding: 20px 0;
  font-size: 14px;
}

/* 個人卡 */
.profile-card {
  border: 1px solid #00ff88;
  border-radius: 12px;
  padding: 20px;
}

.profile-card .avatar {
  width: 60px;
  height: 60px;
  font-size: 22px;
  margin: 0 auto 10px;
}

/* 首頁迷你資訊條 */
.mini-bar {
  display: flex;
  align-items: center;
  text-align: left;
  gap: 4px;
  padding: 4px 0;
}

.mini-bar .info { flex: 1; }
.mini-bar .lvl { opacity: .6; font-size: 12px; }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 65px;
  background: #111;
  border-top: 1px solid #00ff88;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-btn {
  background: none;
  border: none;
  font-size: 13px;
  padding: 5px;
  color: #00ff88;
  flex: 1;
  border-radius: 0;
  margin: 0;
  opacity: .55;
}

.nav-btn.active {
  opacity: 1;
  text-shadow: 0 0 8px #00ff88;
}

.small-btn {
  font-size: 12px;
  padding: 4px 8px;
  opacity: .7;
}
</style>
</head>

<body>

<h1>ISECR INTERNAL NETWORK</h1>

<!-- 登入選單 -->
<div class="box" id="menu">
  <h2>身份驗證</h2>
  <button onclick="showLogin()">已有帳號</button>
  <button onclick="showRegister()">新成員</button>
</div>

<!-- 登入 -->
<div class="box hidden" id="login">
  <h2>成員登入</h2>
  <input id="loginName" placeholder="用戶名">
  <input id="loginPass" type="password" placeholder="密碼">
  <br>
  <button onclick="login()">登入</button>
  <button onclick="backMenu()">返回</button>
</div>

<!-- 激活 -->
<div class="box hidden" id="register">
  <h2>新成員激活</h2>
  <input id="invite" placeholder="邀請碼">
  <br>
  <button onclick="register()">激活帳號</button>
  <button onclick="backMenu()">返回</button>
</div>

<!-- 動態首頁 -->
<div class="box hidden" id="home">
  <h2>🏠 ISECR 動態牆</h2>
  <div id="profileMini"></div>
  <hr>
  <textarea id="postInput" rows="4" placeholder="發布新的訊息..."></textarea>
  <button onclick="createPost()">發布</button>
  <hr>
  <div id="feed"></div>
</div>

<!-- 貼文詳細頁 -->
<div class="box hidden" id="postView">
  <button onclick="backHome()">← 返回</button>
  <div id="postDetail"></div>
</div>

<!-- 個人中心 -->
<div class="box hidden" id="profile">
  <div id="profileCard"></div>
  <hr>
  <h3>我的文章</h3>
  <div id="myPosts"></div>
</div>

<!-- 成員列表 -->
<div class="box hidden" id="members">
  <h2>👥 ISECR 成員</h2>
  <div id="memberList"></div>
</div>

<!-- 設定 -->
<div class="box hidden" id="settings">
  <h2>⚙ 系統設定</h2>
  <button onclick="logout()">登出</button>
</div>

<!-- 手機底部導航 -->
<div class="bottom-nav hidden" id="navbar">
  <button class="nav-btn" data-page="home" onclick="showPage('home')">🏠<br>動態</button>
  <button class="nav-btn" data-page="members" onclick="showPage('members')">👥<br>成員</button>
  <button class="nav-btn" data-page="profile" onclick="showPage('profile')">👤<br>我的</button>
  <button class="nav-btn" data-page="settings" onclick="showPage('settings')">⚙<br>設定</button>
</div>

<script>
// ======================
// 資料初始化
// ======================

let currentUser = localStorage.getItem("currentUser") || "";
let currentPostId = null;

fetch("/api/members")

let posts = JSON.parse(localStorage.getItem("posts")) || [];

// ======================
// 工具函式
// ======================

// 防止使用者輸入被當成 HTML 執行
function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function saveMembers() {
  localStorage.setItem("members", JSON.stringify(members));
}

function savePosts() {
  localStorage.setItem("posts", JSON.stringify(posts));
}

// ======================
// 頁面控制
// ======================

const PAGES = ["menu", "login", "register", "home", "postView", "profile", "members", "settings"];

function hideAll() {
  PAGES.forEach(id => {
    const e = document.getElementById(id);
    if (e) e.classList.add("hidden");
  });
}

function showPage(page) {
  hideAll();
  document.getElementById(page).classList.remove("hidden");

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });

  if (page === "home") showFeed();
  if (page === "profile") showProfile();
  if (page === "members") showMembers();
}

function backMenu() {
  hideAll();
  document.getElementById("menu").classList.remove("hidden");
}

function backHome() {
  showPage("home");
}

// ======================
// 登入系統
// ======================

function showLogin() {
  hideAll();
  document.getElementById("login").classList.remove("hidden");
}

function showRegister() {
  hideAll();
  document.getElementById("register").classList.remove("hidden");
}

function enterApp() {
  document.getElementById("navbar").classList.remove("hidden");
  localStorage.setItem("currentUser", currentUser);
  showPage("home");
}

function login() {
  const name = document.getElementById("loginName").value.trim();
  const pass = document.getElementById("loginPass").value;

  const user = members.find(m => m.username === name && m.password === pass);

  if (user) {
    currentUser = user.username;
    enterApp();
  } else {
    alert("身份驗證拒絕");
  }
}

function register() {
  const invite = document.getElementById("invite").value.trim();
  const user = members.find(m => m.invite === invite);

  if (!user) {
    alert("邀請碼錯誤");
    return;
  }
  if (user.used) {
    alert("邀請碼已使用");
    return;
  }

  user.used = true;
  saveMembers();

  alert("激活成功\n帳號：" + user.username + "\n密碼：" + user.password);

  // 直接帶去登入頁，並預填帳號方便使用者
  showLogin();
  document.getElementById("loginName").value = user.username;
  document.getElementById("invite").value = "";
}

function logout() {
  currentUser = "";
  localStorage.removeItem("currentUser");
  document.getElementById("navbar").classList.add("hidden");
  backMenu();
}

// 若上次登入狀態還在，重新整理頁面時自動恢復
window.addEventListener("DOMContentLoaded", () => {
  if (currentUser && members.some(m => m.username === currentUser)) {
    enterApp();
  }
});

// ======================
// 發布文章
// ======================

function createPost() {
  const input = document.getElementById("postInput");
  const text = input.value.trim();

  if (text === "") {
    alert("內容不能為空");
    return;
  }

  fetch("/api/posts", {
 method:"POST",
 body: JSON.stringify(post)
})
  
  input.value = "";
  showFeed();
}

function deletePost(id) {
  if (!confirm("確定要刪除這則貼文嗎？")) return;
  posts = posts.filter(p => p.id !== id);
  savePosts();
  showFeed();
  showProfile();
}

// ======================
// 動態牆
// ======================

function showFeed() {
  renderProfileMini();

  const box = document.getElementById("feed");

  if (posts.length === 0) {
    box.innerHTML = `<div class="empty">目前沒有任何動態，快發布第一則訊息吧</div>`;
    return;
  }

  box.innerHTML = posts.slice().reverse().map(p => {
    const liked = p.likedBy.includes(currentUser);
    return `
      <div class="post">
        <div class="post-body" onclick="openPost(${p.id})">
          <span class="avatar">◉</span>
          <span class="username">${escapeHTML(p.author)}</span>
          <br><br>
          ${escapeHTML(p.content)}
          <div class="meta">時間：${p.time}</div>
        </div>
        <div class="action">
          <button class="${liked ? 'liked' : ''}" onclick="likePost(${p.id})">❤️ ${p.likes}</button>
          <button onclick="openPost(${p.id})">💬 ${p.comments.length}</button>
          ${p.author === currentUser ? `<button class="small-btn" onclick="deletePost(${p.id})">刪除</button>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

function renderProfileMini() {
  const user = members.find(m => m.username === currentUser);
  const box = document.getElementById("profileMini");
  if (!user || !box) return;

  box.innerHTML = `
    <div class="mini-bar">
      <span class="avatar">◉</span>
      <div class="info">
        <div class="username">${escapeHTML(user.username)}</div>
        <div class="lvl">等級：${escapeHTML(user.level)}</div>
      </div>
      <button class="small-btn" onclick="showPage('profile')">個人中心</button>
    </div>
  `;
}

// ======================
// 點讚（切換式，防止重複點擊）
// ======================

function likePost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  const idx = post.likedBy.indexOf(currentUser);
  if (idx === -1) {
    post.likedBy.push(currentUser);
    post.likes++;
  } else {
    post.likedBy.splice(idx, 1);
    post.likes--;
  }

  savePosts();

  // 依目前所在頁面重新渲染，避免打斷使用者操作
  if (!document.getElementById("home").classList.contains("hidden")) {
    showFeed();
  } else if (currentPostId === id) {
    openPost(id);
  }
}

// ======================
// 詳細頁
// ======================

function openPost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  currentPostId = id;
  hideAll();
  document.getElementById("postView").classList.remove("hidden");

  const liked = post.likedBy.includes(currentUser);

  document.getElementById("postDetail").innerHTML = `
    <div class="post">
      <h3>${escapeHTML(post.author)}</h3>
      <p>${escapeHTML(post.content)}</p>
      <div class="meta">時間：${post.time}</div>
      <button class="${liked ? 'liked' : ''}" onclick="likePost(${post.id})">❤️ ${post.likes}</button>
      <hr>
      <h3>回覆</h3>
      <div id="comments"></div>
      <input id="commentInput" placeholder="輸入回覆" onkeydown="if(event.key==='Enter')addComment()">
      <button onclick="addComment()">發送</button>
    </div>
  `;

  showComments(post);
}

function showComments(post) {
  const box = document.getElementById("comments");

  if (post.comments.length === 0) {
    box.innerHTML = `<div class="empty">還沒有回覆</div>`;
    return;
  }

  box.innerHTML = post.comments.map(c => `
    <div class="comment">
      <b>${escapeHTML(c.user)}</b>
      ${escapeHTML(c.text)}
    </div>
  `).join("");
}

function addComment() {
  const input = document.getElementById("commentInput");
  const text = input.value.trim();
  if (text === "") return;

  const post = posts.find(p => p.id === currentPostId);
  if (!post) return;

  post.comments.push({ user: currentUser, text: text });
  savePosts();
  openPost(currentPostId);
}

// ======================
// 個人資料
// ======================

function showProfile() {
  const user = members.find(m => m.username === currentUser);
  if (!user) return;

  document.getElementById("profileCard").innerHTML = `
    <div class="profile-card">
      <div class="avatar">◉</div>
      <h2>${escapeHTML(user.username)}</h2>
      <p>等級：${escapeHTML(user.level)}</p>
      <p>${escapeHTML(user.bio)}</p>
      <p>文章數：${posts.filter(p => p.author === currentUser).length}</p>
    </div>
  `;

  const mine = document.getElementById("myPosts");
  const myPosts = posts.filter(p => p.author === currentUser);

  if (myPosts.length === 0) {
    mine.innerHTML = `<div class="empty">你還沒有發布任何文章</div>`;
    return;
  }

  mine.innerHTML = myPosts.slice().reverse().map(p => `
    <div class="post">
      ${escapeHTML(p.content)}
      <div class="action">
        <span>❤️ ${p.likes}</span>
        <button class="small-btn" onclick="deletePost(${p.id})">刪除</button>
      </div>
    </div>
  `).join("");
}

// ======================
// 成員列表
// ======================

function showMembers() {
  const box = document.getElementById("memberList");

  box.innerHTML = members.map(m => `
    <div class="post">
      <b>${escapeHTML(m.username)}</b>${m.username === currentUser ? "（你）" : ""}
      <br>等級：${escapeHTML(m.level)}
      <br>${escapeHTML(m.bio)}
    </div>
  `).join("");
}
</script>

</body>
</html>
